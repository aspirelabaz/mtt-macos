name: MTT
options:
  bundleIdPrefix: local.mtt
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  MTPKit:
    path: ../Packages/MTPKit

settings:
  base:
    # Personal team ID (Xcode > Settings > Accounts). Empty = ad-hoc signing,
    # which builds but can't load the Finder extension.
    DEVELOPMENT_TEAM: K5GD459T4W
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # App Group shared by the app and the extension (TeamIdentifierPrefix = "TEAMID.").
    MTT_APP_GROUP: $(TeamIdentifierPrefix)local.mtt

targets:
  MTT:
    type: application
    platform: macOS
    sources: [MTT]
    dependencies:
      - package: MTPKit
        product: MTPKit
      - package: MTPKit
        product: MTTShared
      - target: MTTFileProvider
      # Vendored libmtp/libusb, copied into Contents/Frameworks and re-signed.
      - framework: ../Vendor/libmtp/lib/libmtp.9.dylib
        embed: true
        codeSign: true
      - framework: ../Vendor/libmtp/lib/libusb-1.0.0.dylib
        embed: true
        codeSign: true
        link: false
    info:
      path: MTT/Info.plist
      properties:
        CFBundleDisplayName: MTT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        MTTAppGroup: $(MTT_APP_GROUP)
        # Drag type for moving items inside the browser (UTType.mttItem).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: local.mtt.item
            UTTypeDescription: MTT phone item
            UTTypeConformsTo: [public.data]
    entitlements:
      path: MTT/MTT.entitlements
      properties:
        com.apple.security.application-groups: [$(MTT_APP_GROUP)]
    settings:
      base:
        PRODUCT_NAME: MTT
        PRODUCT_BUNDLE_IDENTIFIER: local.mtt.app
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Not sandboxed: it owns the USB connection through libmtp/libusb.
        ENABLE_APP_SANDBOX: NO
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../Vendor/libmtp/lib
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Write launch agent plist
        basedOnDependencyAnalysis: false
        script: |
          # launchd agent that runs the app and owns its Mach service (name includes the team ID).
          DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$DIR"
          cat > "$DIR/local.mtt.agent.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>local.mtt.agent</string>
            <key>BundleProgram</key><string>Contents/MacOS/MTT</string>
            <key>MachServices</key>
            <dict><key>${MTT_APP_GROUP}.service</key><true/></dict>
            <key>RunAtLoad</key><true/>
            <key>ProcessType</key><string>Interactive</string>
            <key>LimitLoadToSessionType</key><string>Aqua</string>
            <key>AssociatedBundleIdentifiers</key><array><string>local.mtt.app</string></array>
          </dict>
          </plist>
          EOF

  MTTFileProvider:
    type: app-extension
    platform: macOS
    sources: [../FileProviderExt]
    dependencies:
      - package: MTPKit
        product: MTTShared
    info:
      path: ../FileProviderExt/Info.plist
      properties:
        CFBundleDisplayName: MTT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MTTAppGroup: $(MTT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      path: ../FileProviderExt/MTTFileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(MTT_APP_GROUP)]
    settings:
      base:
        PRODUCT_NAME: MTTFileProvider
        PRODUCT_BUNDLE_IDENTIFIER: local.mtt.app.fileprovider
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
